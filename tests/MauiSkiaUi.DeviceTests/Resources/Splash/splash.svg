<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    No SVG <filter> elements: MAUI 10.0.101 Resizetizer + Svg.Skia fails on any filter
    (MissingMethodException CreateMatrixConvolution). See https://github.com/dotnet/maui/issues/38319
  -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#13244B"/>
      <stop offset="55%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#060B16"/>
    </radialGradient>
    <linearGradient id="ink" x1="300" y1="360" x2="760" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="pill" x1="614" y1="506" x2="738" y2="562" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0.8"/>
    </linearGradient>
    <g id="letters">
      <g fill="none" stroke="url(#ink)" stroke-width="90" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 290 420 C 265 375 172 380 168 438 C 165 482 212 494 238 505 C 270 517 302 532 296 582 C 289 640 182 642 158 596"/>
        <path d="M 398 415 L 398 630"/>
        <path d="M 480 468 L 404 546 L 480 628"/>
        <path d="M 596 415 L 596 554 A 76 76 0 0 0 748 554 L 748 415"/>
        <path d="M 858 505 L 858 630"/>
      </g>
      <circle cx="858" cy="394" r="47" fill="url(#ink)"/>
      <!-- toggle switch nested in the U -->
      <rect x="614" y="506" width="124" height="56" rx="28" fill="url(#pill)"/>
      <circle cx="710" cy="534" r="30" fill="#A5F3FC"/>
      <circle cx="710" cy="534" r="23" fill="#ECFEFF"/>
    </g>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <use xlink:href="#letters" href="#letters"/>
</svg>
