name: NuGet pack

# Produces the SkiaUi.Maui and SkiaUi.Maui.CommunityToolkit .nupkg / .snupkg artifacts (does not push to nuget.org).
# macOS packs net10.0 + Android + iOS + Mac Catalyst; Windows adds the Windows TFM;
# a merge job combines both into one multi-TFM package each (scripts/merge_nupkgs.py).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version (empty = Version from Directory.Build.props)
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*"

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION:-}" ]]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$REF_TYPE" == "tag" && "$REF_NAME" == v* ]]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION=""
          fi
          # Reject values that would break MSBuild -p:Version=...
          if [[ -n "$VERSION" && ! "$VERSION" =~ ^[A-Za-z0-9._+-]+$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ -n "$VERSION" ]]; then
            echo "Packing with Version=$VERSION"
          else
            echo "Packing with project Version (Directory.Build.props)"
          fi

  pack-apple:
    name: Pack (macOS TFMs)
    needs: resolve-version
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET MAUI
        uses: ./.github/actions/setup-dotnet-maui
        with:
          workloads: maui-android maui-ios maui-maccatalyst
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Extract release notes
        env:
          PACKAGE_VERSION: ${{ needs.resolve-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${PACKAGE_VERSION:-}"
          if [[ -z "$VERSION" ]]; then
            VERSION="$(sed -n 's/^[[:space:]]*<Version>\([^<]*\)<\/Version>/\1/p' Directory.Build.props | head -1)"
          fi
          python3 scripts/extract-release-notes.py "$VERSION" CHANGELOG.md artifacts/release-notes.txt

      - name: Pack
        env:
          PACKAGE_VERSION: ${{ needs.resolve-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nuget
          ARGS=(
            -c Release
            -o artifacts/nuget
            -p:ContinuousIntegrationBuild=true
            -p:IncludeSymbols=true
            -p:SymbolPackageFormat=snupkg
          )
          if [[ -n "${PACKAGE_VERSION:-}" ]]; then
            ARGS+=(-p:Version="${PACKAGE_VERSION}")
          fi
          # Do not pass -p:TargetFrameworks=… here: a semicolon-list via -p is misapplied as
          # singular TargetFramework (NETSDK1046). On macOS the csproj already selects
          # net10.0 + android + ios + maccatalyst via OS conditions.
          # Every package (SkiaUi.Maui and its integrations), released together with one version.
          for project in MauiSkiaUi/MauiSkiaUi.csproj MauiSkiaUi.CommunityToolkit/MauiSkiaUi.CommunityToolkit.csproj; do
            dotnet pack "$project" "${ARGS[@]}"
          done
          ls -la artifacts/nuget

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-macos
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error

  pack-windows:
    name: Pack (Windows TFM)
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET MAUI
        uses: ./.github/actions/setup-dotnet-maui
        with:
          workloads: maui-windows maui-android
          java-version: "21"

      - name: Extract release notes
        env:
          PACKAGE_VERSION: ${{ needs.resolve-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${PACKAGE_VERSION:-}"
          if [[ -z "$VERSION" ]]; then
            VERSION="$(sed -n 's/^[[:space:]]*<Version>\([^<]*\)<\/Version>/\1/p' Directory.Build.props | head -1)"
          fi
          python3 scripts/extract-release-notes.py "$VERSION" CHANGELOG.md artifacts/release-notes.txt

      - name: Pack Windows TFM
        env:
          PACKAGE_VERSION: ${{ needs.resolve-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nuget-win
          ARGS=(
            -c Release
            -o artifacts/nuget-win
            -p:ContinuousIntegrationBuild=true
            -p:IncludeSymbols=true
            -p:SymbolPackageFormat=snupkg
            -p:TargetFrameworks="net10.0-windows10.0.19041.0"
          )
          if [[ -n "${PACKAGE_VERSION:-}" ]]; then
            ARGS+=(-p:Version="${PACKAGE_VERSION}")
          fi
          # Every package (SkiaUi.Maui and its integrations), released together with one version.
          for project in MauiSkiaUi/MauiSkiaUi.csproj MauiSkiaUi.CommunityToolkit/MauiSkiaUi.CommunityToolkit.csproj; do
            dotnet pack "$project" "${ARGS[@]}"
          done
          ls -la artifacts/nuget-win

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-windows
          path: |
            artifacts/nuget-win/*.nupkg
            artifacts/nuget-win/*.snupkg
          if-no-files-found: error

  merge:
    name: Merge multi-TFM package
    needs: [pack-apple, pack-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download macOS package
        uses: actions/download-artifact@v8
        with:
          name: nuget-macos
          path: incoming/macos

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: nuget-windows
          path: incoming/windows

      - name: Merge nupkg / snupkg
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/merge_nupkgs.py incoming/macos incoming/windows artifacts/nuget
          ls -la artifacts/nuget

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error
