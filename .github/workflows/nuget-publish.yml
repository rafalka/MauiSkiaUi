name: NuGet publish

# Packs MauiSkiaUi (macOS + Windows TFMs merged) and pushes to https://www.nuget.org/
# via Trusted Publishing (OIDC):
#   https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing
# Uses GitHub Environment "nuget.org" (match this name in the nuget.org trusted policy).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish (required)
        required: true
        type: string
      dry_run:
        description: Pack only; do not push to nuget.org
        required: false
        type: boolean
        default: false
  release:
    types: [published]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      push: ${{ steps.ver.outputs.push }}
    steps:
      - name: Resolve version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            VERSION="${RELEASE_TAG#v}"
            PUSH=true
          else
            VERSION="${INPUT_VERSION:-}"
            if [[ "${DRY_RUN:-false}" == "true" ]]; then
              PUSH=false
            else
              PUSH=true
            fi
          fi
          if [[ -z "$VERSION" ]]; then
            echo "Version is required" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9._+-]+$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "push=$PUSH" >> "$GITHUB_OUTPUT"
          echo "Publishing Version=$VERSION (push=$PUSH)"

  pack-apple:
    name: Pack (macOS TFMs)
    needs: resolve-version
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET MAUI
        uses: ./.github/actions/setup-dotnet-maui
        with:
          workloads: maui-android maui-ios maui-maccatalyst
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Pack
        env:
          PACKAGE_VERSION: ${{ needs.resolve-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nuget
          # Do not pass -p:TargetFrameworks=… here: a semicolon-list via -p is misapplied as
          # singular TargetFramework (NETSDK1046). On macOS the csproj already selects
          # net10.0 + android + ios + maccatalyst via OS conditions.
          dotnet pack MauiSkiaUi/MauiSkiaUi.csproj \
            -c Release \
            -o artifacts/nuget \
            -p:Version="${PACKAGE_VERSION}" \
            -p:ContinuousIntegrationBuild=true \
            -p:IncludeSymbols=true \
            -p:SymbolPackageFormat=snupkg

      - name: Upload macOS package
        uses: actions/upload-artifact@v6
        with:
          name: nuget-macos
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error

  pack-windows:
    name: Pack (Windows TFM)
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET MAUI
        uses: ./.github/actions/setup-dotnet-maui
        with:
          workloads: maui-windows maui-android
          java-version: "21"

      - name: Pack Windows TFM
        env:
          PACKAGE_VERSION: ${{ needs.resolve-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nuget-win
          dotnet pack MauiSkiaUi/MauiSkiaUi.csproj \
            -c Release \
            -o artifacts/nuget-win \
            -p:Version="${PACKAGE_VERSION}" \
            -p:ContinuousIntegrationBuild=true \
            -p:IncludeSymbols=true \
            -p:SymbolPackageFormat=snupkg \
            -p:TargetFrameworks="net10.0-windows10.0.19041.0"

      - name: Upload Windows package
        uses: actions/upload-artifact@v6
        with:
          name: nuget-windows
          path: |
            artifacts/nuget-win/*.nupkg
            artifacts/nuget-win/*.snupkg
          if-no-files-found: error

  publish:
    name: Merge and publish
    needs: [resolve-version, pack-apple, pack-windows]
    runs-on: ubuntu-24.04
    environment: nuget.org
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Download macOS package
        uses: actions/download-artifact@v7
        with:
          name: nuget-macos
          path: incoming/macos

      - name: Download Windows package
        uses: actions/download-artifact@v7
        with:
          name: nuget-windows
          path: incoming/windows

      - name: Merge nupkg / snupkg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nuget
          python3 <<'PY'
          import pathlib, zipfile, shutil

          def one_pkg(folder: pathlib.Path, suffix: str) -> pathlib.Path:
              matches = sorted(folder.glob(f"*{suffix}"))
              if len(matches) != 1:
                  raise SystemExit(f"Expected one *{suffix} under {folder}, found {matches}")
              return matches[0]

          macos_dir = pathlib.Path("incoming/macos")
          win_dir = pathlib.Path("incoming/windows")
          out_dir = pathlib.Path("artifacts/nuget")
          out_dir.mkdir(parents=True, exist_ok=True)

          for suffix in (".nupkg", ".snupkg"):
              base = one_pkg(macos_dir, suffix)
              win = one_pkg(win_dir, suffix)
              dest = out_dir / base.name
              shutil.copy2(base, dest)
              with zipfile.ZipFile(dest, "a") as zdst, zipfile.ZipFile(win, "r") as zsrc:
                  existing = set(zdst.namelist())
                  for info in zsrc.infolist():
                      name = info.filename
                      if name in existing:
                          continue
                      if name.startswith("lib/") or name.startswith("runtimes/") or name.startswith("ref/"):
                          zdst.writestr(info, zsrc.read(name))
                          print(f"merged {suffix}: {name}")
              print(f"wrote {dest}")
          PY

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v6
        with:
          name: nuget-packages-${{ needs.resolve-version.outputs.version }}
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg

      - name: NuGet login (OIDC → temporary API key)
        if: needs.resolve-version.outputs.push == 'true'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        if: needs.resolve-version.outputs.push == 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for pkg in artifacts/nuget/*.nupkg; do
            echo "Pushing $pkg"
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Dry run notice
        if: needs.resolve-version.outputs.push != 'true'
        run: echo "Dry run — packages were packed and uploaded as artifacts only."
