name: NuGet publish

# Packs SkiaUi.Maui (macOS + Windows TFMs merged) and pushes to https://www.nuget.org/
# via Trusted Publishing (OIDC):
#   https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing
# Uses GitHub Environment "nuget.org" (match this name in the nuget.org trusted policy).
#
# Versioning (docs/Releasing.md): run from master or devel and pick a bump. The workflow computes the version,
# renames CHANGELOG.md's "## Unreleased" section to it, commits "Release <version>" with tag v<version>, then packs
# that commit, pushes the package and creates a GitHub release.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          Version bump (docs/Releasing.md): prerelease (-PrereleaseNN+1), release (drop the prerelease suffix),
          patch / minor / major, or none (publish the current version again, e.g. after a failed publish)
        required: true
        type: choice
        options: [prerelease, release, patch, minor, major, none]
        default: prerelease
      dry_run:
        description: Compute, pack and upload artifacts only; no commit, tag, push to nuget.org or GitHub release
        required: false
        type: boolean
        default: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
      ref: ${{ steps.commit.outputs.ref }}
      push: ${{ steps.ver.outputs.push }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute version
        id: ver
        env:
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
          BRANCH: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REF_TYPE" == branch ]] || { echo "Run this workflow from a branch (master or devel)." >&2; exit 1; }
          VERSION="$(python3 scripts/release_version.py next --bump "$BUMP" --branch "$BRANCH")"
          PUSH=true
          [[ "$DRY_RUN" == true ]] && PUSH=false
          # A version is published once: nuget.org rejects re-pushes, and a silent skip would hide the mistake.
          if curl -fsS "https://api.nuget.org/v3-flatcontainer/skiaui.maui/index.json" \
              | python3 -c "import json,sys; sys.exit(0 if sys.argv[1].lower() in json.load(sys.stdin)['versions'] else 1)" "$VERSION"; then
            if [[ "$PUSH" == true ]]; then echo "$VERSION is already on nuget.org." >&2; exit 1; fi
            echo "::warning::$VERSION is already on nuget.org (dry run continues)"
          fi
          if [[ "$BUMP" != none ]] && git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists." >&2; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "push=$PUSH" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION from $BRANCH (bump=$BUMP, push=$PUSH)"

      - name: Apply version (Directory.Build.props, CHANGELOG.md)
        if: inputs.bump != 'none'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: python3 scripts/release_version.py apply --version "$VERSION"

      - name: Commit and tag
        id: commit
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BRANCH: ${{ github.ref_name }}
          PUSH: ${{ steps.ver.outputs.push }}
          BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PUSH" == true && "$BUMP" != none ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Release $VERSION"
            git tag -a "v$VERSION" -m "SkiaUi.Maui $VERSION"
            git push origin "HEAD:refs/heads/$BRANCH" "v$VERSION"
          fi
          # Pack jobs build this commit. In a dry run (or bump=none) it is the checked-out one; the dry run's
          # applied files travel as an artifact instead.
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload release files
        uses: actions/upload-artifact@v6
        with:
          name: release-files
          path: |
            CHANGELOG.md
            Directory.Build.props

  pack-apple:
    name: Pack (macOS TFMs)
    needs: prepare
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Release files (version, changelog)
        uses: actions/download-artifact@v7
        with:
          name: release-files
          path: .

      - name: Setup .NET MAUI
        uses: ./.github/actions/setup-dotnet-maui
        with:
          workloads: maui-android maui-ios maui-maccatalyst
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Extract release notes
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/extract-release-notes.py "$PACKAGE_VERSION" CHANGELOG.md artifacts/release-notes.txt

      - name: Pack
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nuget
          # Do not pass -p:TargetFrameworks=… here: a semicolon-list via -p is misapplied as
          # singular TargetFramework (NETSDK1046). On macOS the csproj already selects
          # net10.0 + android + ios + maccatalyst via OS conditions.
          dotnet pack MauiSkiaUi/MauiSkiaUi.csproj \
            -c Release \
            -o artifacts/nuget \
            -p:Version="${PACKAGE_VERSION}" \
            -p:ContinuousIntegrationBuild=true \
            -p:IncludeSymbols=true \
            -p:SymbolPackageFormat=snupkg

      - name: Upload macOS package
        uses: actions/upload-artifact@v6
        with:
          name: nuget-macos
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error

  pack-windows:
    name: Pack (Windows TFM)
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Release files (version, changelog)
        uses: actions/download-artifact@v7
        with:
          name: release-files
          path: .

      - name: Setup .NET MAUI
        uses: ./.github/actions/setup-dotnet-maui
        with:
          workloads: maui-windows maui-android
          java-version: "21"

      - name: Extract release notes
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/extract-release-notes.py "$PACKAGE_VERSION" CHANGELOG.md artifacts/release-notes.txt

      - name: Pack Windows TFM
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nuget-win
          dotnet pack MauiSkiaUi/MauiSkiaUi.csproj \
            -c Release \
            -o artifacts/nuget-win \
            -p:Version="${PACKAGE_VERSION}" \
            -p:ContinuousIntegrationBuild=true \
            -p:IncludeSymbols=true \
            -p:SymbolPackageFormat=snupkg \
            -p:TargetFrameworks="net10.0-windows10.0.19041.0"

      - name: Upload Windows package
        uses: actions/upload-artifact@v6
        with:
          name: nuget-windows
          path: |
            artifacts/nuget-win/*.nupkg
            artifacts/nuget-win/*.snupkg
          if-no-files-found: error

  publish:
    name: Merge and publish
    needs: [prepare, pack-apple, pack-windows]
    runs-on: ubuntu-24.04
    environment: nuget.org
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Release files (version, changelog)
        uses: actions/download-artifact@v7
        with:
          name: release-files
          path: .

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Download macOS package
        uses: actions/download-artifact@v7
        with:
          name: nuget-macos
          path: incoming/macos

      - name: Download Windows package
        uses: actions/download-artifact@v7
        with:
          name: nuget-windows
          path: incoming/windows

      - name: Merge nupkg / snupkg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nuget
          python3 <<'PY'
          import pathlib, zipfile, shutil

          def one_pkg(folder: pathlib.Path, suffix: str) -> pathlib.Path:
              matches = sorted(folder.glob(f"*{suffix}"))
              if len(matches) != 1:
                  raise SystemExit(f"Expected one *{suffix} under {folder}, found {matches}")
              return matches[0]

          macos_dir = pathlib.Path("incoming/macos")
          win_dir = pathlib.Path("incoming/windows")
          out_dir = pathlib.Path("artifacts/nuget")
          out_dir.mkdir(parents=True, exist_ok=True)

          for suffix in (".nupkg", ".snupkg"):
              base = one_pkg(macos_dir, suffix)
              win = one_pkg(win_dir, suffix)
              dest = out_dir / base.name
              shutil.copy2(base, dest)
              with zipfile.ZipFile(dest, "a") as zdst, zipfile.ZipFile(win, "r") as zsrc:
                  existing = set(zdst.namelist())
                  for info in zsrc.infolist():
                      name = info.filename
                      if name in existing:
                          continue
                      if name.startswith("lib/") or name.startswith("runtimes/") or name.startswith("ref/"):
                          zdst.writestr(info, zsrc.read(name))
                          print(f"merged {suffix}: {name}")
              print(f"wrote {dest}")
          PY

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v6
        with:
          name: nuget-packages-${{ needs.prepare.outputs.version }}
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg

      - name: NuGet login (OIDC → temporary API key)
        if: needs.prepare.outputs.push == 'true'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        if: needs.prepare.outputs.push == 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for pkg in artifacts/nuget/*.nupkg; do
            echo "Pushing $pkg"
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json
          done

      - name: GitHub release
        if: needs.prepare.outputs.push == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/extract-release-notes.py "$VERSION" CHANGELOG.md artifacts/release-notes.txt
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION exists"
            exit 0
          fi
          flags=()
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          gh release create "v$VERSION" --verify-tag --title "SkiaUi.Maui $VERSION" \
            --notes-file artifacts/release-notes.txt "${flags[@]}" artifacts/nuget/*.nupkg

      - name: Dry run notice
        if: needs.prepare.outputs.push != 'true'
        run: echo "Dry run — packages were packed and uploaded as artifacts only."
