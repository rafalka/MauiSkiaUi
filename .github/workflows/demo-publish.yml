name: Demo publish

# Builds publishable packages of the demo app (MauiSkiaUiDemo) and/or the samples app (MauiSkiaUiSamples) and
# uploads them as artifacts. Android APK is produced unsigned/debug-keystore style for sideload testing unless
# ANDROID_KEYSTORE_* secrets are configured. Mac Catalyst requires a macOS runner and is published as an unsigned
# .app in a zip (right-click > Open on first launch).
#
# With release_tag set (by hand, or by nuget-publish.yml after each release), the apps are built from that tag and
# attached to its GitHub release as SkiaUi-Demo-<version>-android-arm64.apk, SkiaUi-Demo-<version>-maccatalyst.zip
# and the same for SkiaUi-Samples.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        type: choice
        options:
          - Release
          - Debug
        default: Release
      app:
        description: Which app to publish
        required: true
        type: choice
        options:
          - demo
          - samples
          - demo-and-samples
        default: demo
      platforms:
        description: Which platforms to publish
        required: true
        type: choice
        options:
          - android
          - maccatalyst
          - android-and-maccatalyst
        default: android
      release_tag:
        description: Release tag (e.g. v1.0.0) to build from and attach the apps to; empty for artifacts only
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      configuration:
        type: string
        default: Release
      app:
        type: string
        default: demo-and-samples
      platforms:
        type: string
        default: android-and-maccatalyst
      release_tag:
        type: string
        default: ""
  push:
    tags:
      - "demo-v*"

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Turns the inputs into one matrix per platform (a job `if` cannot read the matrix, so the choice is made here).
  # A tag push publishes the Android APK of both apps.
  prepare:
    name: Select apps
    runs-on: ubuntu-24.04
    outputs:
      android: ${{ steps.select.outputs.android }}
      maccatalyst: ${{ steps.select.outputs.maccatalyst }}
    steps:
      - name: Select apps and platforms
        id: select
        env:
          EVENT: ${{ github.event_name }}
          APP: ${{ inputs.app }}
          PLATFORMS: ${{ inputs.platforms }}
        shell: bash
        run: |
          set -euo pipefail
          demo='{"app":"demo","project":"MauiSkiaUiDemo/MauiSkiaUiDemo.csproj"}'
          samples='{"app":"samples","project":"samples/MauiSkiaUiSamples/MauiSkiaUiSamples.csproj"}'
          if [[ "$EVENT" == "push" ]]; then APP=demo-and-samples; PLATFORMS=android; fi
          case "$APP" in
            demo) apps="$demo" ;;
            samples) apps="$samples" ;;
            *) apps="$demo,$samples" ;;
          esac
          android='[]'; maccatalyst='[]'
          [[ "$PLATFORMS" == android* ]] && android="[$apps]"
          [[ "$PLATFORMS" == *maccatalyst ]] && maccatalyst="[$apps]"
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "maccatalyst=$maccatalyst" >> "$GITHUB_OUTPUT"

  android:
    name: Publish Android ${{ matrix.app }}
    needs: prepare
    if: needs.prepare.outputs.android != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.android) }}
    # Pin until ubuntu-latest migrates to 26 (Oct 2026).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}

      - name: Setup .NET MAUI
        uses: ./.github/actions/setup-dotnet-maui
        with:
          workloads: maui-android
          # .NET 10 Android supports JDK 21; prefer it over the older 17 default.
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # net10.0-android defaults to API 36.
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Decode keystore (optional)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 secret — publishing unsigned/debug-signed APK."
            exit 0
          fi
          KEYSTORE_PATH="${{ runner.temp }}/android-keystore.jks"
          B64="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n\t' | sed 's/ /+/g')"
          printf '%s' "$B64" | base64 --decode > "$KEYSTORE_PATH"
          echo "path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Publish Android
        env:
          CONFIG: ${{ github.event_name == 'workflow_dispatch' && inputs.configuration || 'Release' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/${{ matrix.app }}/android
          # Scope TFMs to Android so the multi-TFM library is not restored for net10.0 with an
          # Android RID. Use a single Android RID (not the host linux-x64) — desktop Mono packs
          # were removed in .NET 9+ and host RID leakage causes NU1102 Mono.linux-x64.
          ARGS=(
            "${{ matrix.project }}"
            -f net10.0-android
            -c "$CONFIG"
            -p:TargetFrameworks=net10.0-android
            -p:RuntimeIdentifier=android-arm64
            -p:EnableProfiling=false
            -p:ContinuousIntegrationBuild=true
            -p:AndroidPackageFormats=apk
            -o artifacts/${{ matrix.app }}/android
          )
          if [[ "${{ steps.keystore.outputs.signed }}" == "true" ]]; then
            ARGS+=(
              -p:AndroidKeyStore=true
              -p:AndroidSigningKeyStore="${{ steps.keystore.outputs.path }}"
              -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
              -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD"
              -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD"
            )
          fi
          dotnet publish "${ARGS[@]}"
          find artifacts/${{ matrix.app }}/android -type f \( -name '*.apk' -o -name '*.aab' \) -print

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}-android
          path: |
            artifacts/${{ matrix.app }}/android/**/*.apk
            artifacts/${{ matrix.app }}/android/**/*.aab
          if-no-files-found: error

  maccatalyst:
    name: Publish Mac Catalyst ${{ matrix.app }}
    needs: prepare
    if: needs.prepare.outputs.maccatalyst != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.maccatalyst) }}
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}

      - name: Setup .NET MAUI
        uses: ./.github/actions/setup-dotnet-maui
        with:
          workloads: maui-maccatalyst
          java-version: ""

      - name: Publish Mac Catalyst
        env:
          CONFIG: ${{ github.event_name == 'workflow_dispatch' && inputs.configuration || 'Release' }}
        run: |
          set -euo pipefail
          # Scope TFMs to Mac Catalyst: the libraries are multi-targeted, and restoring their Android TFM needs the
          # android workload (NETSDK1147). No `-o`: with the two Mac Catalyst RIDs it nests the output under the
          # absolute project path, and the universal .app is built into bin/<config>/net10.0-maccatalyst anyway.
          # No `.pkg` (CreatePackage): it needs a signing identity the runner does not have.
          dotnet publish "${{ matrix.project }}" \
            -f net10.0-maccatalyst \
            -c "$CONFIG" \
            -p:TargetFrameworks=net10.0-maccatalyst \
            -p:EnableProfiling=false \
            -p:ContinuousIntegrationBuild=true \
            -p:CreatePackage=false
          bin="$(dirname "${{ matrix.project }}")/bin/$CONFIG/net10.0-maccatalyst"
          app="$(find "$bin" -maxdepth 1 -name '*.app' -print -quit)"
          [[ -n "$app" ]] || { echo "No .app in $bin" >&2; ls -la "$bin"; exit 1; }
          echo "Publishing $app"
          lipo -info "$app/Contents/MacOS/"* || true
          mkdir -p artifacts/${{ matrix.app }}/maccatalyst
          # ditto keeps symlinks and permissions, which a plain artifact zip would drop.
          ditto -c -k --keepParent "$app" "artifacts/${{ matrix.app }}/maccatalyst/${{ matrix.app }}-maccatalyst.zip"
          ls -la artifacts/${{ matrix.app }}/maccatalyst

      - name: Upload Mac Catalyst artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}-maccatalyst
          path: artifacts/${{ matrix.app }}/maccatalyst
          if-no-files-found: error

  release-assets:
    name: Attach apps to ${{ inputs.release_tag }}
    needs: [android, maccatalyst]
    # One platform may be skipped (not selected); attach when nothing failed.
    if: ${{ !cancelled() && inputs.release_tag != '' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Android apps
        uses: actions/download-artifact@v8
        with:
          pattern: "*-android"
          path: incoming

      - name: Download Mac Catalyst apps
        uses: actions/download-artifact@v8
        with:
          pattern: "*-maccatalyst"
          path: incoming

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p out
          shopt -s nullglob
          for dir in incoming/*-android; do
            app="$(basename "$dir" -android)"
            # A Release build without a keystore is signed with the debug key (*-Signed.apk), which installs.
            apk="$(find "$dir" -name '*-Signed.apk' | head -1)"
            [[ -n "$apk" ]] || apk="$(find "$dir" -name '*.apk' | head -1)"
            [[ -n "$apk" ]] || { echo "No APK in $dir" >&2; exit 1; }
            cp "$apk" "out/SkiaUi-${app^}-${version}-android-arm64.apk"
          done
          for dir in incoming/*-maccatalyst; do
            app="$(basename "$dir" -maccatalyst)"
            cp "$dir/${app}-maccatalyst.zip" "out/SkiaUi-${app^}-${version}-maccatalyst.zip"
          done
          ls -la out
          files=(out/*)
          (( ${#files[@]} )) || { echo "Nothing to attach." >&2; exit 1; }
          gh release upload "$TAG" "${files[@]}" --clobber -R "$REPO"
