name: CI

on:
  push:
    branches: [master, devel]
  pull_request:
    branches: [master, devel]
  # Started by the back-merge workflow, whose push to devel starts no workflows on its own.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build & test (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET MAUI
        uses: ./.github/actions/setup-dotnet-maui
        with:
          # Headless tests target net10.0 and net11.0; maui-android registers MAUI packs used by UseMaui projects.
          workloads: maui-android
          java-version: "17"

      - name: Restore
        run: dotnet restore tests/MauiSkiaUi.Tests/MauiSkiaUi.Tests.csproj

      - name: Build library (net10.0, net11.0)
        run: |
          dotnet build MauiSkiaUi/MauiSkiaUi.csproj -c Release -f net10.0 --no-restore -p:ContinuousIntegrationBuild=true
          dotnet build MauiSkiaUi/MauiSkiaUi.csproj -c Release -f net11.0 --no-restore -p:ContinuousIntegrationBuild=true

      - name: Build tests
        run: >
          dotnet build tests/MauiSkiaUi.Tests/MauiSkiaUi.Tests.csproj
          -c Release
          --no-restore
          -p:ContinuousIntegrationBuild=true

      # Both TFMs (net10.0 with MAUI 10, net11.0 with MAUI 11), one results file each.
      - name: Run tests
        run: >
          dotnet test tests/MauiSkiaUi.Tests/MauiSkiaUi.Tests.csproj
          -c Release
          --no-build
          --logger "trx;LogFilePrefix=test-results"
          --results-directory "${{ runner.temp }}/test-results"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore

  # The workload set picks the iOS / Mac Catalyst SDKs and so the Xcode (dotnet/macios release notes name the set
  # for each Xcode). SDK 11 builds both lines' libraries and the net11 demo. net10 Apple apps only build with SDK 10's own
  # workload (SDK 11's net10 Apple packs want Xcode 26), so the net10 legs run on SDK 10 as .NET 10 users do: Xcode 27.2 on
  # the xcode-27 image and Xcode 26.6 on macOS 26. On SDK 10, Directory.Build.props builds the net10 line only.
  build-apple:
    name: Build libraries and iOS demo (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SDK 11, Xcode 27.2
            xcode: "27.2"
            runner: xcode-27
            sdk-version: ""
            workload-version: ""
            demo-tfm: net11.0-ios
          - name: SDK 10, Xcode 27.2
            xcode: "27.2"
            runner: xcode-27
            sdk-version: "10.0.404"
            workload-version: "10.0.404"
            demo-tfm: net10.0-ios
          - name: SDK 10, Xcode 26.6
            xcode: "26.6"
            runner: macos-26
            sdk-version: "10.0.404"
            workload-version: "10.0.401"
            demo-tfm: net10.0-ios
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET MAUI
        uses: ./.github/actions/setup-dotnet-maui
        with:
          workloads: maui-ios maui-maccatalyst
          java-version: ""
          sdk-version: ${{ matrix.sdk-version }}
          workload-version: ${{ matrix.workload-version }}

      - name: Check Xcode version
        run: |
          set -euo pipefail
          have="$(xcodebuild -version | sed -nE 's/^Xcode ([0-9.]+)$/\1/p')"
          [[ "$have" == "${{ matrix.xcode }}" || "$have" == "${{ matrix.xcode }}".* ]] \
            || { echo "Selected Xcode $have, expected ${{ matrix.xcode }}." >&2; exit 1; }

      # SkUiPlatforms keeps the Apple TFMs of the line(s) this SDK builds (Directory.Build.props). The math package references
      # the Markdown package and SkiaUi.Maui, so one build covers three packages.
      - name: Build SkiaUi.Maui, SkiaUi.Maui.Markdown and its math package (Apple TFMs)
        run: >
          dotnet build MauiSkiaUi.Markdown.Math/MauiSkiaUi.Markdown.Math.csproj
          -c Release
          -p:SkUiPlatforms=ios+maccatalyst
          -p:ContinuousIntegrationBuild=true

      - name: Build SkiaUi.Maui.CommunityToolkit (Apple TFMs)
        run: >
          dotnet build MauiSkiaUi.CommunityToolkit/MauiSkiaUi.CommunityToolkit.csproj
          -c Release
          -p:SkUiPlatforms=ios+maccatalyst
          -p:ContinuousIntegrationBuild=true

      # An app build runs the Xcode toolchain (actool, ibtool, linking) that a library build does not. Simulator, so
      # no signing; the TFM list is scoped so restore does not need the android workload (NETSDK1147).
      - name: Build demo app (iOS simulator)
        run: >
          dotnet build MauiSkiaUiDemo/MauiSkiaUiDemo.csproj
          -f ${{ matrix.demo-tfm }}
          -p:TargetFrameworks=${{ matrix.demo-tfm }}
          -p:ContinuousIntegrationBuild=true

  # Both runtimes: net11 (CoreCLR, SDK 11) and net10 (Mono, SDK 10: the only SDK that builds net10 Apple apps with Xcode 27.2).
  device-tests-maccatalyst:
    name: Device tests (Mac Catalyst, Native AOT, net${{ matrix.net }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - net: "11"
            sdk-version: ""
          - net: "10"
            sdk-version: "10.0.404"
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET MAUI
        uses: ./.github/actions/setup-dotnet-maui
        with:
          workloads: maui-maccatalyst
          java-version: ""
          sdk-version: ${{ matrix.sdk-version }}

      # Native AOT (full trimming): also fails on trim / AOT warnings from SkiaUi and checks that drawing works.
      - name: Run memory leak tests (real handlers and platform views)
        run: scripts/device_tests.sh -t maccatalyst --net ${{ matrix.net }} --aot -o artifacts/device-tests/ci

      - name: Upload device test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-tests-maccatalyst-net${{ matrix.net }}
          path: artifacts/device-tests/ci
          if-no-files-found: ignore

  # The Android TFM as MAUI resolves it, and against the newest Xamarin.AndroidX.Core that apps get through Google Play
  # Services and other libraries: a binding change there (issue #78: AccessibilityNodeInfoCompat.Checked turned from bool
  # into int) fails this build instead of crashing those apps. Bump ANDROIDX_CORE_VERSION when a newer binding ships.
  # Both lines on SDK 11: net10.0-android (API 36, minimum 21) and net11.0-android (API 37, minimum 24).
  build-android:
    name: Build library (Android TFM, net${{ matrix.net }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - net: "10"
            api: "36"
            build-tools: "36.0.0"
          - net: "11"
            api: "37.0"
            build-tools: "37.0.0"
    runs-on: ubuntu-24.04
    env:
      ANDROIDX_CORE_VERSION: "1.19.0.1"
      TFM: net${{ matrix.net }}.0-android
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET MAUI
        uses: ./.github/actions/setup-dotnet-maui
        with:
          workloads: maui-android
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The API level and build-tools the TFM defaults to.
          packages: platform-tools platforms;android-${{ matrix.api }} build-tools;${{ matrix.build-tools }}

      # Scoped to the Android TFM so restore does not need the other platforms' workloads.
      - name: Build Android TFM
        run: >
          dotnet build MauiSkiaUi/MauiSkiaUi.csproj
          -c Release
          -f ${{ env.TFM }}
          -p:TargetFrameworks=${{ env.TFM }}
          -p:ContinuousIntegrationBuild=true

      # Holds the Markdown package too, by its reference. Trim and AOT warnings fail these builds.
      - name: Build Markdown packages for Android
        run: >
          dotnet build MauiSkiaUi.Markdown.Math/MauiSkiaUi.Markdown.Math.csproj
          -c Release
          -f ${{ env.TFM }}
          -p:TargetFrameworks=${{ env.TFM }}
          -p:ContinuousIntegrationBuild=true

      - name: Build Android TFM (newest Xamarin.AndroidX.Core)
        run: >
          dotnet build MauiSkiaUi/MauiSkiaUi.csproj
          -c Release
          -f ${{ env.TFM }}
          -p:TargetFrameworks=${{ env.TFM }}
          -p:SkUiAndroidXCoreVersion=${{ env.ANDROIDX_CORE_VERSION }}
          -p:ContinuousIntegrationBuild=true

  build-windows:
    name: Build libraries (Windows TFMs)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET MAUI
        uses: ./.github/actions/setup-dotnet-maui
        with:
          workloads: maui-windows
          java-version: ""

      # Both lines' Windows TFMs (SkUiPlatforms, Directory.Build.props). The math package references the Markdown package and
      # SkiaUi.Maui, so one build covers three packages.
      - name: Build SkiaUi.Maui, SkiaUi.Maui.Markdown and its math package (Windows TFMs)
        run: >
          dotnet build MauiSkiaUi.Markdown.Math/MauiSkiaUi.Markdown.Math.csproj
          -c Release
          -p:SkUiPlatforms=windows
          -p:ContinuousIntegrationBuild=true

      - name: Build SkiaUi.Maui.CommunityToolkit (Windows TFMs)
        run: >
          dotnet build MauiSkiaUi.CommunityToolkit/MauiSkiaUi.CommunityToolkit.csproj
          -c Release
          -p:SkUiPlatforms=windows
          -p:ContinuousIntegrationBuild=true
