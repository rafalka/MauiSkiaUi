name: CI

on:
  push:
    branches: [master, devel]
  pull_request:
    branches: [master, devel]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build & test (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET MAUI
        uses: ./.github/actions/setup-dotnet-maui
        with:
          # Headless tests target net10.0; maui-android registers MAUI packs used by UseMaui projects.
          workloads: maui-android
          java-version: "17"

      - name: Restore
        run: dotnet restore tests/MauiSkiaUi.Tests/MauiSkiaUi.Tests.csproj

      - name: Build library (net10.0)
        run: >
          dotnet build MauiSkiaUi/MauiSkiaUi.csproj
          -c Release
          -f net10.0
          --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: Build tests
        run: >
          dotnet build tests/MauiSkiaUi.Tests/MauiSkiaUi.Tests.csproj
          -c Release
          --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: Run tests
        run: >
          dotnet test tests/MauiSkiaUi.Tests/MauiSkiaUi.Tests.csproj
          -c Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory "${{ runner.temp }}/test-results"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore

  build-apple:
    name: Build libraries (macOS Apple TFMs)
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET MAUI
        uses: ./.github/actions/setup-dotnet-maui
        with:
          workloads: maui-ios maui-maccatalyst
          java-version: ""

      - name: Restore Apple TFMs only
        # %3B = ';' so MSBuild does not treat the list as multiple -p switches.
        run: >
          dotnet restore MauiSkiaUi/MauiSkiaUi.csproj
          -p:TargetFrameworks=net10.0-ios%3Bnet10.0-maccatalyst

      - name: Build iOS TFM
        run: >
          dotnet build MauiSkiaUi/MauiSkiaUi.csproj
          -c Release
          -f net10.0-ios
          --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: Build Mac Catalyst TFM
        run: >
          dotnet build MauiSkiaUi/MauiSkiaUi.csproj
          -c Release
          -f net10.0-maccatalyst
          --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: Restore SkiaUi.Maui.CommunityToolkit (Apple TFMs)
        run: >
          dotnet restore MauiSkiaUi.CommunityToolkit/MauiSkiaUi.CommunityToolkit.csproj
          -p:TargetFrameworks=net10.0-ios%3Bnet10.0-maccatalyst

      - name: Build SkiaUi.Maui.CommunityToolkit (iOS, Mac Catalyst)
        run: |
          dotnet build MauiSkiaUi.CommunityToolkit/MauiSkiaUi.CommunityToolkit.csproj -c Release -f net10.0-ios --no-restore -p:ContinuousIntegrationBuild=true
          dotnet build MauiSkiaUi.CommunityToolkit/MauiSkiaUi.CommunityToolkit.csproj -c Release -f net10.0-maccatalyst --no-restore -p:ContinuousIntegrationBuild=true

      # An app build runs the Xcode toolchain (actool, ibtool, linking) that a library build does not. Simulator, so
      # no signing; the TFM list is scoped so restore does not need the android workload (NETSDK1147).
      - name: Build demo app (iOS simulator)
        run: >
          dotnet build MauiSkiaUiDemo/MauiSkiaUiDemo.csproj
          -f net10.0-ios
          -p:TargetFrameworks=net10.0-ios
          -p:ContinuousIntegrationBuild=true

  device-tests-maccatalyst:
    name: Device tests (Mac Catalyst, Native AOT)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET MAUI
        uses: ./.github/actions/setup-dotnet-maui
        with:
          workloads: maui-maccatalyst
          java-version: ""

      # Native AOT (full trimming): also fails on trim / AOT warnings from SkiaUi and checks that drawing works.
      - name: Run memory leak tests (real handlers and platform views)
        run: scripts/device_tests.sh -t maccatalyst --aot -o artifacts/device-tests/ci

      - name: Upload device test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-tests-maccatalyst
          path: artifacts/device-tests/ci
          if-no-files-found: ignore

  build-windows:
    name: Build libraries (Windows TFM)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET MAUI
        uses: ./.github/actions/setup-dotnet-maui
        with:
          workloads: maui-windows
          java-version: ""

      - name: Restore Windows TFM only
        run: >
          dotnet restore MauiSkiaUi/MauiSkiaUi.csproj
          -p:TargetFrameworks=net10.0-windows10.0.19041.0

      - name: Build Windows TFM
        run: >
          dotnet build MauiSkiaUi/MauiSkiaUi.csproj
          -c Release
          -f net10.0-windows10.0.19041.0
          --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: Restore SkiaUi.Maui.CommunityToolkit (Windows TFM)
        run: >
          dotnet restore MauiSkiaUi.CommunityToolkit/MauiSkiaUi.CommunityToolkit.csproj
          -p:TargetFrameworks=net10.0-windows10.0.19041.0

      - name: Build SkiaUi.Maui.CommunityToolkit (Windows TFM)
        run: >
          dotnet build MauiSkiaUi.CommunityToolkit/MauiSkiaUi.CommunityToolkit.csproj
          -c Release
          -f net10.0-windows10.0.19041.0
          --no-restore
          -p:ContinuousIntegrationBuild=true
