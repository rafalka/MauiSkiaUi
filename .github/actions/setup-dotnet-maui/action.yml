name: Setup .NET MAUI
description: Install the .NET SDK (global.json's, or an SDK 10 band for net10-only jobs), optional JDK, and MAUI workloads for CI

inputs:
  workloads:
    description: Space-separated workload ids (e.g. maui-android or maui)
    required: false
    default: "maui-android"
  java-version:
    description: Temurin JDK major version (empty skips Java setup)
    required: false
    default: ""
  sdk-version:
    description: >
      SDK to use instead of global.json's (e.g. 10.0.404 for net10-only jobs: .NET 10 users' toolchain, and the only one that
      builds net10 iOS / Mac Catalyst apps with Xcode 27.2). The action rewrites global.json to it; Directory.Build.props then
      builds the net10 line only. Empty: global.json (SDK 11, both lines).
    required: false
    default: ""
  workload-version:
    description: >
      Workload set version; empty for the band's pinned set: 11.0.100.1 on SDK 11, 10.0.404 on SDK 10 (iOS / Mac Catalyst 27.2
      SDKs, which need Xcode 27.2). dotnet/macios release notes name the set for each Xcode (10.0.401: Xcode 26.6; 10.0.402.1:
      Xcode 27.1). On macOS the step after the install selects that Xcode.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # One place for the default set: the Windows cache key and the install below both read it, so a new default drops the
    # cached SDK folder instead of updating it on every run.
    # A requested SDK band replaces global.json's SDK here, before anything reads global.json (cache keys, setup-dotnet).
    - name: Resolve SDK and workload set
      id: workload-set
      shell: bash
      env:
        # Callers pass an empty value through when their own input is unset (a tag push has no inputs).
        REQUESTED: ${{ inputs.workload-version }}
        SDK_BAND: ${{ inputs.sdk-version }}
      run: |
        set -euo pipefail
        if [[ -n "$SDK_BAND" ]]; then
          printf '{\n  "sdk": {\n    "version": "%s",\n    "rollForward": "latestPatch"\n  }\n}\n' "$SDK_BAND" > global.json
          echo "global.json now selects SDK $SDK_BAND."
        fi
        major="$(sed -nE 's/.*"version": *"([0-9]+)\..*/\1/p' global.json | head -1)"
        case "$major" in
          10) default=10.0.404 ;;
          11) default=11.0.100.1 ;;
          *) echo "No default workload set for SDK $major; pass workload-version." >&2; exit 1 ;;
        esac
        echo "major=$major" >> "$GITHUB_OUTPUT"
        echo "version=${REQUESTED:-$default}" >> "$GITHUB_OUTPUT"

    # ---- Windows speed-ups -------------------------------------------------------------------------------------
    # Defender scans every file dotnet, NuGet and MSBuild write (SDK, workload packs, packages): turn real-time
    # scanning off for this throwaway VM, and exclude the build folders and tools in case the image blocks that.
    - name: Exclude build folders from Windows Defender
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
        $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:RUNNER_TOOL_CACHE, $env:TEMP,
                   "$env:USERPROFILE\.nuget", "$env:ProgramFiles\dotnet")
        foreach ($path in $paths) { if ($path) { Add-MpPreference -ExclusionPath $path -ErrorAction SilentlyContinue } }
        Add-MpPreference -ExclusionProcess 'dotnet.exe', 'MSBuild.exe', 'VBCSCompiler.exe' -ErrorAction SilentlyContinue
        Get-MpPreference | Select-Object DisableRealtimeMonitoring, ExclusionPath | Format-List

    # The image's SDK lives in Program Files, where workloads install as MSIs, and Visual Studio's install records
    # pull in every other installed workload (iOS, Mac Catalyst, Android, wasm) with it. An SDK installed into a
    # private folder installs workloads as plain files, only the requested ones, and the folder can be cached.
    # The month in the key picks up new SDK patches (global.json rolls forward to the latest patch).
    - name: Use a private .NET install
      id: dotnet-dir
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        dir="${RUNNER_TEMP}\\dotnet"
        echo "DOTNET_INSTALL_DIR=${dir}" >> "$GITHUB_ENV"
        echo "dir=${dir}" >> "$GITHUB_OUTPUT"
        echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

    - name: Cache .NET SDK and workloads
      if: runner.os == 'Windows'
      uses: actions/cache@v6
      with:
        path: ${{ steps.dotnet-dir.outputs.dir }}
        key: dotnet-${{ runner.os }}-${{ hashFiles('global.json') }}-${{ inputs.workloads }}-${{ steps.workload-set.outputs.version }}-${{ steps.dotnet-dir.outputs.month }}-v2

    # Restore downloads the large Windows App SDK packages on every run otherwise.
    - name: Cache NuGet packages
      if: runner.os == 'Windows'
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('global.json', 'Directory.Build.props', '**/*.csproj') }}
        restore-keys: |
          nuget-${{ runner.os }}-${{ github.job }}-

    # ---- All platforms -----------------------------------------------------------------------------------------
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Setup Java
      if: inputs.java-version != ''
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Install MAUI workloads
      shell: bash
      env:
        WORKLOAD_VERSION: ${{ steps.workload-set.outputs.version }}
      run: |
        set -euo pipefail
        # A pinned workload set, not the SDK's baseline manifests: those carry the first iOS / Mac Catalyst SDKs of
        # the band (Xcode 26), and the set is what moves them to a newer Xcode.
        for wl in ${{ inputs.workloads }}; do
          echo "Installing workload: $wl"
          dotnet workload install "$wl" --version "$WORKLOAD_VERSION"
        done
        echo "Pins (Directory.Build.props):"
        # The per-line MAUI / Community Toolkit pins PackageReference Version="$(MauiVersion)" resolves to, and the product Version.
        grep -E '<Maui1[0-9]Version>|<CommunityToolkitMaui1[0-9]Version>|<SkiaSharpVersion>|<Version>' Directory.Build.props || true
        dotnet --info
        dotnet workload list

    # Apple builds (libraries too) need the Xcode the workload set's iOS / Mac Catalyst SDKs were built for; the pack
    # name's suffix is the API level, not the Xcode (set 10.0.402.1's Mac Catalyst 27.0 needs Xcode 27.1). An app project evaluated
    # with this SDK reports it; the image's own packs (other versions) sit next to the set's, so their files can't
    # tell. The image may default to another Xcode: take that version's newest stable patch release.
    - name: Select Xcode
      if: runner.os == 'macOS' && (contains(inputs.workloads, 'ios') || contains(inputs.workloads, 'maccatalyst'))
      shell: bash
      run: |
        set -euo pipefail
        # The SDK's own line: SDK 11 builds net10 libraries too, but no net10 Apple app, whose packs want an older Xcode.
        tfm="net${{ steps.workload-set.outputs.major }}.0"
        probe="$RUNNER_TEMP/xcode-probe"
        mkdir -p "$probe"
        cp global.json "$probe/"
        printf '%s\n' '<Project Sdk="Microsoft.NET.Sdk">' \
          "  <PropertyGroup><TargetFrameworks>$tfm-ios;$tfm-maccatalyst</TargetFrameworks><OutputType>Exe</OutputType></PropertyGroup>" \
          '</Project>' > "$probe/probe.csproj"
        want=""
        for wl in ios maccatalyst; do
          [[ " ${{ inputs.workloads }} " == *"$wl"* ]] || continue
          v="$(cd "$probe" && dotnet msbuild probe.csproj -nologo -getProperty:_RecommendedXcodeVersion -p:TargetFramework="$tfm-$wl")"
          echo "$tfm-$wl needs Xcode $v"
          want="$(printf '%s\n%s\n' "$want" "$v" | sed '/^$/d' | sort -V | tail -1)"
        done
        [[ -n "$want" ]] || { echo "Could not tell which Xcode the iOS / Mac Catalyst SDKs need." >&2; exit 1; }
        ls -d /Applications/Xcode*.app
        xcode="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' \
          | grep -E "/Xcode_${want//./\\.}(\.[0-9]+)*\.app$" | sort -V | tail -1 || true)"
        [[ -n "$xcode" ]] || { echo "No Xcode $want on this runner image." >&2; exit 1; }
        # Images alias Xcode_26.6.0.app -> Xcode_26.6.app; actool can't find the macOS SDK through the alias.
        xcode="$(readlink -f "$xcode")"
        echo "Selecting $xcode"
        sudo xcode-select -s "$xcode"
        xcodebuild -version
